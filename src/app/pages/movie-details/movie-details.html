<div class="min-h-screen bg-gray-950 text-white">

  <!-- Loading -->
  @if (loading) {

    <div class="min-h-[70vh] flex items-center justify-center">

      <div class="text-center">

        <div
          class="mx-auto w-10 h-10 border-4 border-gray-700 border-t-white rounded-full animate-spin"
        ></div>

        <p class="mt-5 text-gray-400">
          Loading movie...
        </p>

      </div>

    </div>

  }


  <!-- Error -->
  @if (error) {

    <div class="min-h-[70vh] flex items-center justify-center">

      <div class="text-center">

        <p class="text-red-400">
          {{ error }}
        </p>

        <a
          routerLink="/"
          class="inline-block mt-6 px-5 py-2 rounded-lg bg-white text-gray-950 font-semibold hover:bg-gray-200 transition"
        >
          Back to Home
        </a>

      </div>

    </div>

  }


  <!-- Movie Details -->
  @if (movie) {

    <!-- Backdrop -->
    <section class="relative">

      <div class="absolute inset-0">

        <img
          [src]="movie.backdrop"
          [alt]="movie.title"
          class="w-full h-full object-cover"
        />

        <div class="absolute inset-0 bg-gray-950/80"></div>

      </div>


      <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="min-h-[650px] flex items-center py-16">

          <div
            class="grid grid-cols-1 md:grid-cols-3 gap-10 items-center w-full"
          >

            <!-- Poster -->
            <div class="md:col-span-1">

              <img
                [src]="movie.poster"
                [alt]="movie.title"
                class="w-full max-w-sm mx-auto rounded-xl shadow-2xl"
              />

            </div>


            <!-- Information -->
            <div class="md:col-span-2">

              <!-- Title -->
              <h1 class="text-4xl sm:text-5xl font-bold">
                {{ movie.title }}
              </h1>


              <!-- Rating / Release Date -->
              <div
                class="flex flex-wrap items-center gap-4 mt-5 text-gray-300"
              >

                <span>
                  ⭐ {{ movie.rating.toFixed(1) }}
                </span>

                @if (movie.releaseDate) {

                  <span>
                    {{ movie.releaseDate | slice:0:4 }}
                  </span>

                }

              </div>


              <!-- Overview -->
              <h2 class="mt-8 text-xl font-semibold">
                Overview
              </h2>

              <p class="mt-3 text-gray-300 leading-7 max-w-3xl">
                {{ movie.overview }}
              </p>


              <!-- Actions -->
              <div class="flex flex-wrap gap-3 mt-8">

                @if (isFavorite()) {

                  <button
                    (click)="removeFromFavorites()"
                    class="px-6 py-3 rounded-lg bg-red-500 text-white font-semibold hover:bg-red-600 transition"
                  >
                    ❤️ Remove from Favorites
                  </button>

                } @else {

                  <button
                    (click)="addToFavorites()"
                    class="px-6 py-3 rounded-lg bg-white text-gray-950 font-semibold hover:bg-gray-200 transition"
                  >
                    🤍 Add to Favorites
                  </button>

                }


                <a
                  routerLink="/"
                  class="px-6 py-3 rounded-lg border border-gray-700 text-white font-semibold hover:bg-gray-900 transition"
                >
                  ← Back to Movies
                </a>

              </div>

            </div>

          </div>

        </div>

      </div>

    </section>

  }

</div>
